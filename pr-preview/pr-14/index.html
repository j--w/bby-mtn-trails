<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Trail Route Builder</title>
<style>
/* The site is the route builder widget's first consumer: a top bar and a start screen around widget/v1.
   Tokens follow the Training Tracker design (system font, slate ink, blue accent); the widget has its own copy. */
:root{
  color-scheme:light;
  --bg:#f5f6f8; --surface:#ffffff; --surface-hover:#fafbfc; --text:#17202b; --muted:#5d6775; --faint:#8a93a0;
  --border:#dde1e7; --border-strong:#c7cdd5; --grid:#eceff3;
  --accent:#2155cc; --accent-soft:#e9effc; --on-accent:#ffffff;
  --done:#1b7f45; --done-soft:#e5f4ea; --partial:#a85f00; --partial-soft:#fcf0dc;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:10px; --radius-sm:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0f141b; --surface:#171d26; --surface-hover:#1c2330; --text:#e6eaf0; --muted:#9aa4b2; --faint:#6c7685;
  --border:#2a3240; --border-strong:#3a4454; --grid:#222a36;
  --accent:#7aa2ff; --accent-soft:#1d2a47; --on-accent:#0f141b;
  --done:#5cc98a; --done-soft:#17301f; --partial:#f0a54a; --partial-soft:#3a2a12}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f141b; --surface:#171d26; --surface-hover:#1c2330; --text:#e6eaf0; --muted:#9aa4b2; --faint:#6c7685;
  --border:#2a3240; --border-strong:#3a4454; --grid:#222a36;
  --accent:#7aa2ff; --accent-soft:#1d2a47; --on-accent:#0f141b;
  --done:#5cc98a; --done-soft:#17301f; --partial:#f0a54a; --partial-soft:#3a2a12;
 }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.bar h1{margin:0;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.button{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 14px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface);font-weight:500;cursor:pointer;text-decoration:none;color:inherit}
.button:hover{background:var(--surface-hover)}
.button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.button.quiet{border-color:transparent;color:var(--accent)}
.notice{border-radius:var(--radius-sm);padding:10px 12px;font-size:14px;background:var(--partial-soft);color:var(--text)}
#app{flex:1;min-height:0}
@media (max-width:480px){.bar .wide{display:none}.bar .button{padding:0 8px}}
.start{max-width:440px;margin:12vh auto;padding:0 16px;display:flex;flex-direction:column;gap:14px}
.start h1{font-size:22px;margin:0}
</style>
</head>
<body>
<header class="bar" id="bar" hidden>
  <h1 id="title">Trail routes</h1>
  <label class="button quiet">Open<span class="wide"> an area file</span><input type="file" id="areafile" accept=".json,application/json" hidden></label>
  <a class="button quiet" href="setup/">Set up<span class="wide"> an area</span></a>
</header>
<main id="app"></main>
<main class="start" id="start" hidden>
  <h1>Trail routes</h1>
  <p class="notice" id="problem" hidden></p>
  <p class="muted">Build loops on a trail network you’ve set up. Open an area file, or make one from OpenStreetMap.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <label class="button primary">Open<span class="wide"> an area file</span><input type="file" id="startfile" accept=".json,application/json" hidden></label>
    <a class="button" href="setup/">Set up<span class="wide"> an area</span></a>
  </div>
  <p class="small muted" id="starterr"></p>
</main>
<script type="module">
// Page chrome only: which area to open (?area=<url>, else the last one opened in this browser), opening files,
// and the start screen. Everything route-related is the widget.
import { mount, readArea } from './widget/v1/trails-widget.js';
import { loadArea, saveArea } from './js/area-store.js';
const $ = id => document.getElementById(id);

async function openFile(file, report) {
  try {
    const area = readArea(await file.text());
    if (!await saveArea('current', area)) throw new Error('this browser won’t store it.');
    location.href = './';
  } catch (err) { report(`Couldn’t open that file: ${err.message}`); }
}
function startScreen(problem) {
  $('app').hidden = true; $('bar').hidden = true; $('start').hidden = false;
  $('problem').hidden = !problem; $('problem').textContent = problem ? `Couldn’t open that area: ${problem}` : '';
  $('startfile').onchange = e => e.target.files[0] && openFile(e.target.files[0], m => $('starterr').textContent = m);
}

const url = new URLSearchParams(location.search).get('area');
let area = null;
try {
  const json = url && url !== 'local' ? await fetch(url).then(r => r.ok ? r.text() : null).catch(() => null) : await loadArea('current');
  if (!json) throw new Error(url && url !== 'local' ? 'the file couldn’t be read.' : '');
  area = readArea(json);
} catch (err) { startScreen(err.message); }

if (area) {
  document.title = `${area.name} Route Builder`;
  $('bar').hidden = false;
  $('areafile').onchange = e => e.target.files[0] && openFile(e.target.files[0], alert);
  mount($('app'), { area, autoBuild: true });
}
</script>
</body>
</html>
