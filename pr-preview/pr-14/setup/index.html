<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Set Up an Area</title>
<style>
/* The setup page is the setup widget's first consumer: a top bar around widget/v1/setup-widget.js.
   Tokens follow the Training Tracker design (system font, slate ink, blue accent); the widget has its own copy. */
:root{
  color-scheme:light;
  --bg:#f5f6f8; --surface:#ffffff; --surface-hover:#fafbfc; --text:#17202b; --muted:#5d6775; --faint:#8a93a0;
  --border:#dde1e7; --border-strong:#c7cdd5; --grid:#eceff3;
  --accent:#2155cc; --accent-soft:#e9effc; --on-accent:#ffffff;
  --done:#1b7f45; --done-soft:#e5f4ea; --partial:#a85f00; --partial-soft:#fcf0dc;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:10px; --radius-sm:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0f141b; --surface:#171d26; --surface-hover:#1c2330; --text:#e6eaf0; --muted:#9aa4b2; --faint:#6c7685;
  --border:#2a3240; --border-strong:#3a4454; --grid:#222a36;
  --accent:#7aa2ff; --accent-soft:#1d2a47; --on-accent:#0f141b;
  --done:#5cc98a; --done-soft:#17301f; --partial:#f0a54a; --partial-soft:#3a2a12}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f141b; --surface:#171d26; --surface-hover:#1c2330; --text:#e6eaf0; --muted:#9aa4b2; --faint:#6c7685;
  --border:#2a3240; --border-strong:#3a4454; --grid:#222a36;
  --accent:#7aa2ff; --accent-soft:#1d2a47; --on-accent:#0f141b;
  --done:#5cc98a; --done-soft:#17301f; --partial:#f0a54a; --partial-soft:#3a2a12;
 }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
.bar h1{margin:0;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.button{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 14px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);background:var(--surface);font-weight:500;cursor:pointer;text-decoration:none;color:inherit}
.button:hover{background:var(--surface-hover)}
.button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.button.quiet{border-color:transparent;color:var(--accent)}
#app{flex:1;min-height:0}
</style>
</head>
<body>
<header class="bar">
  <h1>Trail routes</h1>
  <a class="button quiet" href="../">Back to routes</a>
</header>
<main id="app"></main>
<script type="module">
// Page chrome only. Saving hands the area to the route builder page through this browser's storage.
import { mountSetup } from '../widget/v1/setup-widget.js';
import { loadArea, saveArea } from '../js/area-store.js';

// start the map on the last area this browser built routes on, if any
const last = await loadArea('current');
const b = last?.bbox;
mountSetup(document.getElementById('app'), {
  view: b ? { center: [(b[0] + b[2]) / 2, (b[1] + b[3]) / 2], zoom: 12 } : undefined,
  saveLabel: 'Build routes here',
  async onAreaSaved(area) {
    if (!await saveArea('current', area)) throw new Error('This browser won’t store the area. Download the file to keep it.');
    location.href = '../';
  },
});
</script>
</body>
</html>
