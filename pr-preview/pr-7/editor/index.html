<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Burnaby Mountain Trail Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&family=Overpass+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-screen trail-map workbench — map canvas left, inspector rail right; stacks on phones. */
:root{
  --bg:#edf0ea; --surface:#f8faf6; --ink:#1b2620; --muted:#5f6d64; --line:#cfd6cc; --faint:#dde3da;
  --accent:#e2560f; --accent-soft:#fbe3d4;
  --g1:#2b8a3e; --g2:#1864ab; --g3:#1b2620; --conn:#8a948d; --unset:#a7b2a9;
  --s1:#f2d16b; --s2:#f0a33c; --s3:#e5652a; --s4:#c22e2e; --s0:#b9c6bb;
  --ref-trail:#b4bdb1; --ref-paved:#d3d9d0; --missing:#8b4fc7; --warn:#d9480f; --conn-x:#2f7c8f;
  --font-ui:"Overpass",ui-sans-serif,system-ui,sans-serif;
  --font-num:"Overpass Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111713; --surface:#18201b; --ink:#e3e9e3; --muted:#93a198; --line:#2c3730; --faint:#212a24;
  --accent:#ff7a33; --accent-soft:#3a2418;
  --g1:#51cf66; --g2:#4dabf7; --g3:#e3e9e3; --conn:#7c877f; --unset:#56625a;
  --s1:#d9b84e; --s2:#e89434; --s3:#f06a2e; --s4:#ff5a5a; --s0:#3d4a41; --ref-trail:#3e4a42; --ref-paved:#2a332d; --missing:#b98cf0; --warn:#ff8c42; --conn-x:#5fb8cc; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111713; --surface:#18201b; --ink:#e3e9e3; --muted:#93a198; --line:#2c3730; --faint:#212a24;
  --accent:#ff7a33; --accent-soft:#3a2418;
  --g1:#51cf66; --g2:#4dabf7; --g3:#e3e9e3; --conn:#7c877f; --unset:#56625a;
  --s1:#d9b84e; --s2:#e89434; --s3:#f06a2e; --s4:#ff5a5a; --s0:#3d4a41; --ref-trail:#3e4a42; --ref-paved:#2a332d; --missing:#b98cf0; --warn:#ff8c42; --conn-x:#5fb8cc; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
header h1 span{color:var(--accent)}
header .meta{color:var(--muted);font-family:var(--font-num);font-size:12px;font-variant-numeric:tabular-nums}
.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
.mapwrap{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--bg)}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map.dragging{cursor:grabbing}
#map.split{cursor:crosshair}
.tools{position:absolute;left:12px;top:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 24px)}
.seg-ctl{display:inline-flex;border:1px solid var(--line);background:var(--surface);border-radius:6px;overflow:hidden}
.seg-ctl button{border:0;border-right:1px solid var(--line);background:none}
.seg-ctl button:last-child{border-right:0}
button{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{background:var(--faint)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:var(--s4)}
button:disabled{opacity:.45;cursor:default}
.legend{position:absolute;left:12px;bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:12px;display:flex;flex-direction:column;gap:4px;max-width:calc(100% - 24px)}
.legend .row{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.legend i{display:inline-block;width:18px;height:4px;border-radius:2px;vertical-align:middle;margin-right:5px}
.hint{position:absolute;right:12px;top:12px;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 10px;border-radius:6px;max-width:260px}
aside{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:none;padding:10px 6px;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pane{overflow:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px;min-height:0;flex:1}
h2{font-size:15px;margin:0;font-weight:800;text-wrap:balance}
h3{font-size:11px;margin:0;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-family:var(--font-num);font-size:15px;font-variant-numeric:tabular-nums}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
input[type=text],select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
textarea{font-family:var(--font-num);font-size:11.5px;min-height:150px;resize:vertical}
.grades{display:flex;gap:6px;flex-wrap:wrap}
.grades button{display:inline-flex;align-items:center;gap:6px;padding:6px 9px}
.sym{width:14px;height:14px;display:inline-block;flex:none}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.item{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 10px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;text-align:left;font-weight:400;width:100%}
.item:last-child{border-bottom:0}
.item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .num{font-family:var(--font-num);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.item.on{background:var(--accent-soft)}
.chip{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:4px;background:var(--faint);color:var(--muted);white-space:nowrap}
.chip.climb{background:var(--accent-soft);color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.callout{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--bg);font-size:13px;display:flex;flex-direction:column;gap:6px}
.profile{width:100%;height:auto;display:block}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 12px;border-radius:6px;font-size:13px}
a{color:var(--accent);font-weight:600}
ol.steps{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
@media (max-width: 760px){
  .main{grid-template-columns:1fr;grid-template-rows:56vh auto}
  aside{border-left:0;border-top:1px solid var(--line)}
  .pane{overflow:visible}
  .app{height:auto}
  .hint{display:none}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Burnaby Mountain <span>Trail Editor</span></h1>
    <div class="meta" id="meta"></div>
  </header>
  <div class="main">
    <div class="mapwrap">
      <svg id="map" aria-label="Trail network map"></svg>
      <div class="tools">
        <div class="seg-ctl" role="group" aria-label="Mode">
          <button id="mode-select" aria-pressed="true">Select</button>
          <button id="mode-split" aria-pressed="false">Split</button>
        </div>
        <div class="seg-ctl" role="group" aria-label="Colour by">
          <button id="color-grade" aria-pressed="true">Grade</button>
          <button id="color-steep" aria-pressed="false">Steepness</button>
        </div>
        <button id="btn-fit" title="Fit network">Fit</button>
        <button id="btn-zin" aria-label="Zoom in">+</button>
        <button id="btn-zout" aria-label="Zoom out">−</button>
        <button id="btn-osm" aria-pressed="true" title="Show OpenStreetMap paths behind your network">OSM layer</button>
        <button id="btn-undo" disabled>Undo</button>
      </div>
      <div class="legend" id="legend"></div>
      <div class="hint" id="hint" hidden></div>
      <div class="toast" id="toast" hidden></div>
    </div>
    <aside>
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-inspect" aria-selected="true">Inspect</button>
        <button role="tab" id="tab-blocks" aria-selected="false">Blocks</button>
        <button role="tab" id="tab-export" aria-selected="false">Export</button>
      </div>
      <div class="pane" id="pane"></div>
    </aside>
  </div>
</div>

<script type="module">
const DATA = await fetch('../data/burnaby-mountain-editor.json').then(r => r.json());
const STORE_KEY = 'bm-trail-editor-v3';
const BLOCK_MAX_M = 5000;
const NS = 'http://www.w3.org/2000/svg';
const GRADES = [
  {v:1, name:'Green', desc:'Well graded, runnable'},
  {v:2, name:'Blue', desc:'Rooty or rocky, some steep pitches'},
  {v:3, name:'Black', desc:'Steep, technical'},
  {v:4, name:'Double black', desc:'Very steep or hazardous'},
];

/* ---------- geometry ---------- */
const N = DATA.nodes; // [lat, lon, ele]
const lat0 = N[0][0] * Math.PI / 180, R = 6371000;
const X = N.map(n => n[1] * Math.PI/180 * R * Math.cos(lat0));
const Y = N.map(n => -n[0] * Math.PI/180 * R);
const dist = (a,b) => Math.hypot(X[a]-X[b], Y[a]-Y[b]);

function segStats(path){
  let len=0, up=0, dn=0; const cum=[0];
  for(let i=1;i<path.length;i++){
    len += dist(path[i-1], path[i]); cum.push(len);
    const dz = N[path[i]][2]-N[path[i-1]][2];
    if(dz>0) up+=dz; else dn-=dz;
  }
  // steepest sustained 100 m (absolute grade)
  let steep=0, j=0;
  for(let i=0;i<path.length;i++){
    while(j<path.length-1 && cum[j]-cum[i] < 100) j++;
    const d = cum[j]-cum[i];
    if(d >= 60){ steep = Math.max(steep, Math.abs(N[path[j]][2]-N[path[i]][2])/d); }
  }
  return {len, up, dn, cum, steep};
}

/* ---------- state ---------- */
const PAVED_MIN = 0.6; // conn extras carry paved:1
function applyOsm(s, o){
  if(!o) return;
  s.osm = o;
  if(!s.name && o.name){ s.name = o.name; s.nameSrc = 'osm'; }
  if(s.grade==null && o.imba){ s.grade = o.imba; s.gradeSrc = 'osm'; }
  if(s.kind==='trail' && o.paved>=PAVED_MIN){ s.kind = 'connector'; s.kindSrc = 'osm'; }
}
function freshState(){
  const segs = DATA.segs.map((s,i)=>({
    id:'s'+(i+1), path:s.p.slice(), name:'', kind:'trail', grade:null, gradeDown:null,
    oneway:'no', notes:'', ran:{f:s.f, r:s.r}
  }));
  segs.forEach((s,i)=>applyOsm(s, DATA.segs[i].osm));
  const nodes = {};
  nodes[DATA.start] = {type:'trailhead', name:'GPX start'};
  // top: if it is a dead end, use the junction that leads to it
  let top = DATA.top;
  const spur = segs.find(s => s.path[0]===top || s.path[s.path.length-1]===top);
  const endsAt = n => segs.filter(s=>s.path[0]===n||s.path[s.path.length-1]===n).length;
  if(spur && endsAt(top)===1){ top = spur.path[0]===top ? spur.path[spur.path.length-1] : spur.path[0]; }
  nodes[top] = {type:'hub', name:'Summit area'};
  return {segs, nodes, blocks:[], next:segs.length+1};
}
let S, restored=false;
try{ const raw = localStorage.getItem(STORE_KEY); if(raw){ S = JSON.parse(raw); restored = true; } }catch(e){}
if(!S || !Array.isArray(S.segs)) { S = freshState(); restored=false; }
else {
  // bring OSM suggestions into a draft saved before they existed, without overwriting edits
  S.segs.forEach(s=>{ const i=+s.id.slice(1)-1, d=DATA.segs[i];
    if(!s.osm && d && d.p[0]===s.path[0] && d.p[d.p.length-1]===s.path[s.path.length-1]) applyOsm(s, d.osm); });
}
const history = [];
function commit(label){
  history.push(JSON.stringify(S)); if(history.length>60) history.shift();
  document.getElementById('btn-undo').disabled = false;
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); }catch(e){} }
function changed(){ save(); renderMap(); renderPane(); renderMeta(); }

let ui = {osm:true, tab:'inspect', sel:null, mode:'select', color:'grade', blockSel:null, blockFrom:'all', confirmReset:false};

/* ---------- derived ---------- */
function ends(){
  const m = new Map();
  for(const s of S.segs){
    for(const n of [s.path[0], s.path[s.path.length-1]]){ if(!m.has(n)) m.set(n,[]); m.get(n).push(s); }
  }
  return m;
}
const segById = id => S.segs.find(s=>s.id===id);
function nodeLabel(n){
  const m = S.nodes[n];
  if(m && m.name) return m.name;
  return 'J' + n;
}
function segLabel(s){ return s.name || ('Segment ' + s.id.slice(1)); }
const fmtKm = m => m>=1000 ? (m/1000).toFixed(2)+' km' : Math.round(m)+' m';
const fmtM = m => Math.round(m)+' m';

/* ---------- map view ---------- */
const svg = document.getElementById('map');
let view = null; // {x,y,w,h}
function bounds(){
  let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;
  for(const s of S.segs) for(const n of s.path){ a=Math.min(a,X[n]); b=Math.min(b,Y[n]); c=Math.max(c,X[n]); d=Math.max(d,Y[n]); }
  return {x:a,y:b,w:c-a,h:d-b};
}
function fit(){
  const bb = bounds(), r = svg.getBoundingClientRect();
  const pad = 0.08, aspect = r.width / Math.max(1,r.height);
  let w = bb.w*(1+2*pad), h = bb.h*(1+2*pad);
  if(w/h < aspect) w = h*aspect; else h = w/aspect;
  view = {x: bb.x + bb.w/2 - w/2, y: bb.y + bb.h/2 - h/2, w, h};
  applyView();
}
function applyView(){ svg.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`); renderMap(); }
function pxToM(){ const r = svg.getBoundingClientRect(); return view.w / Math.max(1,r.width); }
function toWorld(cx, cy){ const r = svg.getBoundingClientRect(); return {x: view.x + (cx-r.left)/r.width*view.w, y: view.y + (cy-r.top)/r.height*view.h}; }
function zoomAt(f, cx, cy){
  const p = toWorld(cx, cy);
  view = {x: p.x - (p.x-view.x)*f, y: p.y - (p.y-view.y)*f, w: view.w*f, h: view.h*f};
  applyView();
}

function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function gradeColor(g){ return g===1?'var(--g1)':g===2?'var(--g2)':g>=3?'var(--g3)':'var(--unset)'; }
function steepColor(gr){ const a=Math.abs(gr); return a<.05?'var(--s0)':a<.10?'var(--s1)':a<.15?'var(--s2)':a<.20?'var(--s3)':'var(--s4)'; }

function el(tag, attrs, parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k, attrs[k]); if(parent) parent.appendChild(e); return e; }
function pathD(path){ return 'M' + path.map(n => X[n].toFixed(1)+' '+Y[n].toFixed(1)).join('L'); }

function blockPathNodes(b){
  const out=[];
  for(const st of b.steps){ const s=segById(st.seg); if(!s) continue; out.push(st.dir>0? s.path : s.path.slice().reverse()); }
  return out;
}

let refLayer=null;
function buildRef(){
  refLayer = document.createElementNS(NS,'g');
  const k = Math.PI/180*R*Math.cos(lat0), kk = Math.PI/180*R;
  const base = document.createElementNS(NS,'g'), miss = document.createElementNS(NS,'g');
  (DATA.ref||[]).forEach((w,i)=>{
    const d = 'M'+w.c.map(c=>(c[0]*k).toFixed(1)+' '+(-c[1]*kk).toFixed(1)).join('L');
    if(w.m){
      el('path',{d,fill:'none',stroke:'var(--missing)','stroke-width':2.5,'stroke-dasharray':'5 4','stroke-linecap':'round','vector-effect':'non-scaling-stroke'},miss);
      el('path',{d,fill:'none',stroke:'transparent','stroke-width':12,'vector-effect':'non-scaling-stroke','data-ref':i,style:'cursor:pointer'},miss);
    } else {
      el('path',{d,fill:'none',stroke: w.k==='trail'?'var(--ref-trail)':'var(--ref-paved)','stroke-width': w.k==='trail'?1.6:w.k==='road'?2.6:1.2,'vector-effect':'non-scaling-stroke'},base);
    }
  });
  refLayer.appendChild(base); refLayer.appendChild(miss);
  refLayer.missLayer = miss;
}
function issueXY(it){
  if(it.type==='gap') return {x:X[it.node], y:Y[it.node]};
  return {x: it.ll[1]*Math.PI/180*R*Math.cos(lat0), y: -it.ll[0]*Math.PI/180*R};
}
function openIssues(){ const dis=new Set(S.dismissed||[]); return (DATA.issues||[]).map((it,i)=>({...it,i})).filter(it=>!dis.has(it.i)); }
function renderMap(){
  if(!view) return;
  svg.textContent='';
  const px = pxToM();
  // grid every 250 m
  const g = el('g',{},svg);
  const step = view.w/px > 0 ? (px*80 > 250 ? 1000 : 250) : 250;
  for(let x=Math.floor(view.x/step)*step; x<view.x+view.w; x+=step) el('line',{x1:x,y1:view.y,x2:x,y2:view.y+view.h,stroke:'var(--faint)','stroke-width':1,'vector-effect':'non-scaling-stroke'},g);
  for(let y=Math.floor(view.y/step)*step; y<view.y+view.h; y+=step) el('line',{x1:view.x,y1:y,x2:view.x+view.w,y2:y,stroke:'var(--faint)','stroke-width':1,'vector-effect':'non-scaling-stroke'},g);

  if(ui.osm){ if(!refLayer) buildRef(); svg.appendChild(refLayer); }
  if(ui.osm){ const xg=el('g',{},svg); const added=new Set(S.added||[]);
    (DATA.extras||[]).forEach((e,i)=>{ if(added.has(i)) return; const d=pathD(e.p); const sel=ui.sel&&ui.sel.t==='extra'&&ui.sel.id===i;
      if(sel) el('path',{d,fill:'none',stroke:'var(--missing)','stroke-width':10,'stroke-opacity':.3,'stroke-linecap':'round','vector-effect':'non-scaling-stroke'},xg);
      if(e.osm.conn) el('path',{d,fill:'none',stroke:'var(--conn-x)','stroke-width':2.4,'stroke-dasharray':'2 3','stroke-linecap':'round','vector-effect':'non-scaling-stroke'},xg);
      else el('path',{d,fill:'none',stroke:'var(--missing)','stroke-width':e.osm.highway==='footway'?1.6:2.4,'stroke-dasharray':'5 4','stroke-linecap':'round','stroke-opacity':e.osm.highway==='footway'?.6:1,'vector-effect':'non-scaling-stroke'},xg);
      el('path',{d,fill:'none',stroke:'transparent','stroke-width':12,'vector-effect':'non-scaling-stroke','data-extra':i,style:'cursor:pointer'},xg); }); }
  const hl = el('g',{},svg), lines = el('g',{},svg), hits = el('g',{},svg), dots = el('g',{},svg), labels = el('g',{},svg);
  if(ui.sel && ui.sel.t==='ref' && DATA.ref[ui.sel.id]){ const w=DATA.ref[ui.sel.id]; const k=Math.PI/180*R*Math.cos(lat0), kk=Math.PI/180*R;
    el('path',{d:'M'+w.c.map(c=>(c[0]*k).toFixed(1)+' '+(-c[1]*kk).toFixed(1)).join('L'),fill:'none',stroke:'var(--missing)','stroke-width':10,'stroke-opacity':.35,'stroke-linecap':'round','vector-effect':'non-scaling-stroke'},hl); }
  // highlight: selected block or selected segment
  if(ui.blockSel){
    for(const p of blockPathNodes(ui.blockSel)) el('path',{d:pathD(p),fill:'none',stroke:'var(--accent)','stroke-width':11,'stroke-linecap':'round','stroke-linejoin':'round','stroke-opacity':.45,'vector-effect':'non-scaling-stroke'},hl);
  }
  if(ui.sel && ui.sel.t==='seg'){ const s=segById(ui.sel.id); if(s) el('path',{d:pathD(s.path),fill:'none',stroke:'var(--accent)','stroke-width':12,'stroke-linecap':'round','stroke-linejoin':'round','stroke-opacity':.55,'vector-effect':'non-scaling-stroke'},hl); }

  for(const s of S.segs){
    if(ui.color==='steep'){
      for(let i=1;i<s.path.length;i++){
        const a=s.path[i-1], b=s.path[i], d=dist(a,b); const gr = d>0 ? (N[b][2]-N[a][2])/d : 0;
        el('line',{x1:X[a],y1:Y[a],x2:X[b],y2:Y[b],stroke:steepColor(gr),'stroke-width':4,'stroke-linecap':'round','vector-effect':'non-scaling-stroke'},lines);
      }
    } else {
      const attrs = {d:pathD(s.path),fill:'none',stroke: s.kind==='connector'?'var(--conn)':gradeColor(s.grade),'stroke-width': s.grade?4:3,'stroke-linecap':'round','stroke-linejoin':'round','vector-effect':'non-scaling-stroke'};
      if(s.kind==='connector') attrs['stroke-dasharray']='6 5';
      el('path',attrs,lines);
      if(s.grade===4 && s.kind!=='connector') el('path',{d:pathD(s.path),fill:'none',stroke:'var(--bg)','stroke-width':1.2,'vector-effect':'non-scaling-stroke'},lines);
    }
    const h = el('path',{d:pathD(s.path),fill:'none',stroke:'transparent','stroke-width':16,'stroke-linecap':'round','vector-effect':'non-scaling-stroke','data-seg':s.id,style:'cursor:pointer'},hits);
  }
  // nodes
  const E = ends();
  for(const [n, list] of E){
    const meta = S.nodes[n]; const deg = list.length;
    const sel = ui.sel && ui.sel.t==='node' && ui.sel.id===n;
    let r = 4, fill='var(--surface)', stroke='var(--ink)', sw=1.5;
    if(meta && meta.type==='hub'){ r=7; fill='var(--accent)'; stroke='var(--surface)'; sw=2; }
    else if(meta && meta.type==='trailhead'){ r=7; fill='var(--ink)'; stroke='var(--surface)'; sw=2; }
    else if(deg===1){ r=3.5; fill='var(--bg)'; stroke='var(--muted)'; }
    if(sel){ el('circle',{cx:X[n],cy:Y[n],r:(r+6)*px,fill:'none',stroke:'var(--accent)','stroke-width':2.5,'vector-effect':'non-scaling-stroke'},dots); }
    if(meta && meta.type==='trailhead'){
      const s2=(r+1)*px; el('rect',{x:X[n]-s2,y:Y[n]-s2,width:2*s2,height:2*s2,fill,stroke,'stroke-width':sw,'vector-effect':'non-scaling-stroke','data-node':n,style:'cursor:pointer'},dots);
    } else {
      el('circle',{cx:X[n],cy:Y[n],r:r*px,fill,stroke,'stroke-width':sw,'vector-effect':'non-scaling-stroke','data-node':n,style:'cursor:pointer'},dots);
    }
    // bigger invisible hit target
    el('circle',{cx:X[n],cy:Y[n],r:11*px,fill:'transparent','data-node':n,style:'cursor:pointer'},dots);
    if(meta && meta.type){
      const t = el('text',{x:X[n]+10*px,y:Y[n]-8*px,'font-size':12*px,'font-family':'Overpass, sans-serif','font-weight':800,fill:'var(--ink)',stroke:'var(--bg)','stroke-width':3,'paint-order':'stroke','vector-effect':'non-scaling-stroke'},labels);
      t.textContent = meta.name || (meta.type==='hub'?'Hub':'Trailhead');
    }
  }
  // check markers
  for(const it of openIssues()){
    const p=issueXY(it), r=8*px, on = ui.sel && ui.sel.t==='issue' && ui.sel.id===it.i;
    el('path',{d:`M${p.x} ${p.y-r*1.3}L${p.x+r*1.15} ${p.y+r*.75}L${p.x-r*1.15} ${p.y+r*.75}Z`,fill:'var(--warn)',stroke: on?'var(--ink)':'var(--surface)','stroke-width':on?2.5:1.5,'vector-effect':'non-scaling-stroke','data-issue':it.i,style:'cursor:pointer'},labels);
  }
  // scale bar
  const sb = 500, sx = view.x + view.w - 24*px - sb, sy = view.y + view.h - 24*px;
  el('line',{x1:sx,y1:sy,x2:sx+sb,y2:sy,stroke:'var(--ink)','stroke-width':2,'vector-effect':'non-scaling-stroke'},svg);
  for(const xx of [sx,sx+sb]) el('line',{x1:xx,y1:sy-4*px,x2:xx,y2:sy+4*px,stroke:'var(--ink)','stroke-width':2,'vector-effect':'non-scaling-stroke'},svg);
  const st = el('text',{x:sx+sb/2,y:sy-8*px,'text-anchor':'middle','font-size':11*px,'font-family':'Overpass Mono, monospace',fill:'var(--ink)'},svg); st.textContent='500 m';
  const na = el('text',{x:sx+sb+4*px,y:sy-30*px,'text-anchor':'end','font-size':12*px,'font-weight':800,'font-family':'Overpass, sans-serif',fill:'var(--muted)'},svg); na.textContent='N ↑';
  renderLegend();
}

function sym(g, size=14){
  const c = g===1?'var(--g1)':g===2?'var(--g2)':'var(--g3)';
  if(g===1) return `<svg class="sym" viewBox="0 0 14 14" width="${size}" height="${size}"><circle cx="7" cy="7" r="6" fill="${c}"/></svg>`;
  if(g===2) return `<svg class="sym" viewBox="0 0 14 14" width="${size}" height="${size}"><rect x="1.5" y="1.5" width="11" height="11" fill="${c}"/></svg>`;
  if(g===3) return `<svg class="sym" viewBox="0 0 14 14" width="${size}" height="${size}"><path d="M7 .5 13.5 7 7 13.5 .5 7z" fill="${c}"/></svg>`;
  if(g===4) return `<svg class="sym" viewBox="0 0 22 14" width="${size*1.57}" height="${size}"><path d="M6 .5 11 7 6 13.5 1 7zM16 .5 21 7 16 13.5 11 7z" fill="${c}"/></svg>`;
  return `<svg class="sym" viewBox="0 0 14 14" width="${size}" height="${size}"><circle cx="7" cy="7" r="5.5" fill="none" stroke="var(--unset)" stroke-width="1.5" stroke-dasharray="2 2"/></svg>`;
}

/* ---------- interactions ---------- */
let drag=null; const pointers=new Map();
svg.addEventListener('pointerdown', e=>{
  svg.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1) drag={x:e.clientX,y:e.clientY,v:{...view},moved:false,target:e.target};
  else drag=null;
});
svg.addEventListener('pointermove', e=>{
  if(!pointers.has(e.pointerId)) return;
  const prev = pointers.get(e.pointerId);
  if(pointers.size===2){
    const [a,b]=[...pointers.values()];
    const d0=Math.hypot(a.x-b.x,a.y-b.y);
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const [c,d]=[...pointers.values()];
    const d1=Math.hypot(c.x-d.x,c.y-d.y);
    if(d0>0&&d1>0) zoomAt(d0/d1,(c.x+d.x)/2,(c.y+d.y)/2);
    return;
  }
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(!drag.moved && Math.hypot(dx,dy)>4){ drag.moved=true; svg.classList.add('dragging'); }
  if(drag.moved){ const k=pxToM(); view={...drag.v,x:drag.v.x-dx*k,y:drag.v.y-dy*k}; applyView(); }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  svg.classList.remove('dragging');
  if(drag && !drag.moved && e.type==='pointerup'){ handleClick(drag.target, e.clientX, e.clientY); }
  drag=null;
}
svg.addEventListener('pointerup', endPointer);
svg.addEventListener('pointercancel', endPointer);
svg.addEventListener('wheel', e=>{ e.preventDefault(); zoomAt(Math.exp(e.deltaY*0.0015), e.clientX, e.clientY); }, {passive:false});

function handleClick(target, cx, cy){
  const t = document.elementFromPoint(cx, cy) || target;
  const nodeAttr = t && t.getAttribute && t.getAttribute('data-node');
  const segAttr = t && t.getAttribute && t.getAttribute('data-seg');
  const refAttr = t && t.getAttribute && t.getAttribute('data-ref');
  const issueAttr = t && t.getAttribute && t.getAttribute('data-issue');
  const extraAttr = t && t.getAttribute && t.getAttribute('data-extra');
  if(ui.mode==='split'){
    if(segAttr){ splitAt(segAttr, cx, cy); } else toast('Tap on a trail line to split it.');
    return;
  }
  if(issueAttr!==null && issueAttr!==undefined){ ui.sel={t:'issue',id:+issueAttr}; ui.tab='inspect'; }
  else if(nodeAttr!==null && nodeAttr!==undefined){ ui.sel={t:'node',id:+nodeAttr}; ui.tab='inspect'; }
  else if(segAttr){ ui.sel={t:'seg',id:segAttr}; ui.tab='inspect'; }
  else if(extraAttr!==null && extraAttr!==undefined){ ui.sel={t:'extra',id:+extraAttr}; ui.tab='inspect'; }
  else if(refAttr!==null && refAttr!==undefined){ ui.sel={t:'ref',id:+refAttr}; ui.tab='inspect'; }
  else ui.sel=null;
  ui.blockSel=null;
  renderTabs(); renderMap(); renderPane();
}

function splitAt(segId, cx, cy){
  const s = segById(segId); const p = toWorld(cx,cy);
  let best=-1, bd=Infinity;
  for(let i=1;i<s.path.length-1;i++){ const d=Math.hypot(X[s.path[i]]-p.x, Y[s.path[i]]-p.y); if(d<bd){bd=d;best=i;} }
  if(best<1){ toast('This segment is too short to split.'); return; }
  const mx = 30*pxToM();
  if(bd > Math.max(mx, 40)){ toast('No trail vertex near that spot. Zoom in and tap closer to the line.'); return; }
  commit('split');
  const n = s.path[best];
  const b = {...JSON.parse(JSON.stringify(s)), id:'s'+(S.next++), path:s.path.slice(best), name: s.name || ''};
  s.path = s.path.slice(0,best+1);
  S.segs.splice(S.segs.indexOf(s)+1, 0, b);
  // blocks referencing s become invalid
  invalidateBlocks([s.id]);
  ui.sel={t:'node',id:n};
  toast('Split. A new junction was added.');
  changed();
}
function invalidateBlocks(ids){
  const before = S.blocks.length;
  S.blocks = S.blocks.filter(b => !b.steps.some(st => ids.includes(st.seg)));
  if(S.blocks.length<before) toast('Removed saved blocks that used the changed segment.');
}
function mergeAt(n){
  const list = ends().get(n);
  if(!list || list.length!==2 || list[0]===list[1]) return;
  commit('merge');
  let [a,b] = list;
  let pa = a.path[a.path.length-1]===n ? a.path.slice() : a.path.slice().reverse();
  let pb = b.path[0]===n ? b.path.slice() : b.path.slice().reverse();
  a.path = pa.concat(pb.slice(1));
  if(!a.name && b.name) a.name=b.name;
  if(a.grade==null) a.grade=b.grade;
  S.segs.splice(S.segs.indexOf(b),1);
  delete S.nodes[n];
  invalidateBlocks([a.id,b.id]);
  ui.sel={t:'seg',id:a.id};
  toast('Merged into one segment.');
  changed();
}

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function profileSvg(path){
  const st = segStats(path); const W=320,H=96,pl=34,pb=16,pt=8,pr=6;
  const es = path.map(n=>N[n][2]); const lo=Math.min(...es), hi=Math.max(...es); const span=Math.max(20,hi-lo);
  const y0 = lo - (span-(hi-lo))/2;
  const xs = d => pl + d/st.len*(W-pl-pr), ys = e => H-pb - (e-y0)/span*(H-pb-pt);
  const pts = path.map((n,i)=>xs(st.cum[i]).toFixed(1)+','+ys(N[n][2]).toFixed(1)).join(' ');
  return `<svg class="profile" viewBox="0 0 ${W} ${H}" role="img" aria-label="Elevation profile">
    <line x1="${pl}" y1="${ys(hi)}" x2="${W-pr}" y2="${ys(hi)}" stroke="var(--faint)"/>
    <line x1="${pl}" y1="${ys(lo)}" x2="${W-pr}" y2="${ys(lo)}" stroke="var(--faint)"/>
    <polygon points="${pl},${H-pb} ${pts} ${W-pr},${H-pb}" fill="var(--accent-soft)"/>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <text x="${pl-4}" y="${ys(hi)+4}" text-anchor="end" font-size="10" font-family="Overpass Mono, monospace" fill="var(--muted)">${Math.round(hi)}</text>
    <text x="${pl-4}" y="${ys(lo)+4}" text-anchor="end" font-size="10" font-family="Overpass Mono, monospace" fill="var(--muted)">${Math.round(lo)}</text>
    <text x="${pl}" y="${H-3}" font-size="10" font-family="Overpass Mono, monospace" fill="var(--muted)">0</text>
    <text x="${W-pr}" y="${H-3}" text-anchor="end" font-size="10" font-family="Overpass Mono, monospace" fill="var(--muted)">${fmtKm(st.len)}</text>
  </svg>`;
}

function ranText(r){

}

const IMBA_NAMES = {1:'Green (IMBA 0–1)',2:'Blue (IMBA 2)',3:'Black (IMBA 3)',4:'Double black (IMBA 4)'};
function osmBlock(s){
  const o=s.osm; if(!o) return '';
  const bits=[];
  if(o.gpxOnly) bits.push('From your GPX. OSM has no path mapped here.');
  if(o.added) bits.push('Added from OSM. It is off your GPX, so its elevation is a rough estimate.');
  if(o.name) bits.push(`Mostly <b>${esc(o.name)}</b>${o.nameCov<0.95?` (${Math.round(o.nameCov*100)}%)`:''}.`); else bits.push('No trail name in OSM.');
  if(o.imba) bits.push(`Difficulty tag: ${IMBA_NAMES[o.imba]}${o.imbaMax>o.imba?`, up to ${IMBA_NAMES[o.imbaMax].split(' (')[0].toLowerCase()} in places`:''}.`);
  if(o.surface) bits.push(`Surface: ${esc(o.surface.replace(/_/g,' '))}.`);
  if(o.sac) bits.push(`Hiking scale: ${esc(o.sac.replace(/_/g,' '))}.`);
  if(o.informal) bits.push('Tagged as an informal trail.');
  if(o.oneway) bits.push('Tagged one-way in OSM.');
  const alt = o.alt ? `<p class="small"><b>Two trails here:</b> ${esc(o.name||'an unnamed trail')} and ${esc(o.alt)}. There is probably a junction to split.</p>` : '';
  return `<div class="callout small"><div class="row" style="justify-content:space-between"><b>OpenStreetMap</b><span class="chip">suggestions</span></div><p class="small">${bits.join(' ')}</p>${alt}</div>`;
}

function addExtra(i){
  const e=DATA.extras[i]; commit();
  for(const n of [e.p[0], e.p[e.p.length-1]]){
    const s=S.segs.find(s=>{ const k=s.path.indexOf(n); return k>0 && k<s.path.length-1; });
    if(s) splitSegAtIndex(s, s.path.indexOf(n));
  }
  const seg={id:'s'+(S.next++), path:e.p.slice(), name:'', kind:'trail', grade:null, gradeDown:null, oneway:'no', notes:'', ran:{f:0,r:0}};
  applyOsm(seg, {...e.osm, added:true});
  S.segs.push(seg); S.added=(S.added||[]).concat([i]);
  const endsNow=new Set(S.segs.filter(x=>x!==seg).flatMap(x=>[x.path[0],x.path[x.path.length-1]]));
  for(let k=seg.path.length-2;k>=1;k--){ if(endsNow.has(seg.path[k])) splitSegAtIndex(seg,k); }
  ui.sel={t:'seg',id:seg.id}; toast('Added to your network.'); changed();
}

// nearest vertex on a segment to a point, optionally skipping segments that end at a node
function nearestVertex(p, excludeNode){
  let best=null;
  for(const s of S.segs){
    if(excludeNode!=null && (s.path[0]===excludeNode || s.path[s.path.length-1]===excludeNode)) continue;
    s.path.forEach((n,k)=>{ const d=Math.hypot(X[n]-p.x,Y[n]-p.y); if(!best||d<best.d) best={s,k,n,d}; });
  }
  return best;
}
function splitSegAtIndex(s,k){
  if(k<=0 || k>=s.path.length-1) return s.path[Math.max(0,Math.min(k,s.path.length-1))];
  const b = {...JSON.parse(JSON.stringify(s)), id:'s'+(S.next++), path:s.path.slice(k)};
  const n=s.path[k]; s.path=s.path.slice(0,k+1); S.segs.splice(S.segs.indexOf(s)+1,0,b); invalidateBlocks([s.id]); return n;
}
function addLink(a,b){
  if(a===b) return;
  if(S.segs.some(s=>(s.path[0]===a&&s.path[s.path.length-1]===b&&s.path.length===2)||(s.path[0]===b&&s.path[s.path.length-1]===a&&s.path.length===2))) return;
  S.segs.push({id:'s'+(S.next++), path:[a,b], name:'', kind:'trail', grade:null, gradeDown:null, oneway:'no', notes:'Link added by a check', ran:{f:0,r:0}});
}
function connectAt(p, fromNode, issueIdx){
  commit();
  if(fromNode!=null){
    const t=nearestVertex({x:X[fromNode],y:Y[fromNode]}, fromNode);
    if(!t || t.d>40){ history.pop(); toast('No trail close enough to connect to.'); return; }
    const n=splitSegAtIndex(t.s,t.k); addLink(fromNode,n);
  } else {
    const a=nearestVertex(p); if(!a){ history.pop(); return; }
    const na=splitSegAtIndex(a.s,a.k);
    let b=null;
    for(const s of S.segs){ if(s.path.includes(na)) continue; s.path.forEach((n,k)=>{ const d=Math.hypot(X[n]-p.x,Y[n]-p.y); if(!b||d<b.d) b={s,k,n,d}; }); }
    if(!b || b.d>30){ history.pop(); toast('Could not find the second trail near this spot.'); return; }
    const nb=splitSegAtIndex(b.s,b.k); addLink(na,nb);
  }
  S.dismissed=(S.dismissed||[]).concat([issueIdx]);
  ui.sel=null; toast('Connected.'); changed();
}

/* ---------- blocks ---------- */
function hubList(){ return Object.entries(S.nodes).filter(([k,v])=>v.type).map(([k,v])=>+k); }
function enumerateBlocks(){
  const hubs = new Set(hubList()); const adj = new Map();
  for(const s of S.segs){
    const a=s.path[0], b=s.path[s.path.length-1], st=segStats(s.path);
    const add=(f,t,dir)=>{ if(!adj.has(f)) adj.set(f,[]); adj.get(f).push({s, to:t, dir, len:st.len, up:dir>0?st.up:st.dn, dn:dir>0?st.dn:st.up}); };
    if(s.oneway!=='reverse') add(a,b,1);
    if(s.oneway!=='forward') add(b,a,-1);
  }
  // distance from every node to its nearest hub, so dead-end searches stop early
  const toHub = new Map(); const q=[...hubs].map(h=>[0,h]);
  while(q.length){ q.sort((x,y)=>x[0]-y[0]); const [dd,n]=q.shift(); if(toHub.has(n)) continue; toHub.set(n,dd);
    for(const e of (adj.get(n)||[])) if(!toHub.has(e.to)) q.push([dd+e.len,e.to]); }
  const out=[]; const MAXLEN=BLOCK_MAX_M, MAX=1500; let pops=0, capped=false;
  for(const h of hubs){
    const stack=[{n:h, steps:[], len:0, up:0, dn:0, seen:new Set([h]), used:new Set()}];
    while(stack.length){
      if(out.length>=MAX || ++pops>250000){ capped=true; break; }
      const cur=stack.pop();
      for(const e of (adj.get(cur.n)||[])){
        if(cur.used.has(e.s.id) || cur.seen.has(e.to)) continue;
        const len=cur.len+e.len; if(len + (toHub.get(e.to)??Infinity) > MAXLEN) continue;
        const nxt={n:e.to, steps:cur.steps.concat([{seg:e.s.id,dir:e.dir}]), len, up:cur.up+e.up, dn:cur.dn+e.dn, seen:new Set(cur.seen).add(e.to), used:new Set(cur.used).add(e.s.id)};
        if(hubs.has(e.to)){ if(e.to!==h) out.push({from:h,to:e.to,steps:nxt.steps,len,up:nxt.up,dn:nxt.dn}); }
        else stack.push(nxt);
      }
    }
  }
  for(const b of out){ const net=b.up-b.dn; b.role = net>40?'climb':net<-40?'descent':'traverse'; b.key=b.steps.map(s=>s.seg+(s.dir>0?'+':'-')).join(','); }
  out.sort((a,b)=> a.from-b.from || a.to-b.to || b.up-a.up);
  out.capped = capped;
  return out;
}
function blockSummary(b){ return b.steps.map(st=>segLabel(segById(st.seg)||{id:st.seg})).join(' → '); }

  const hubs = hubList();

  document.getElementById('block-from').value = from;
  document.getElementById('block-from').onchange=e=>{ ui.blockFrom=e.target.value; renderPane(); };
  pane.querySelectorAll('[data-cand]').forEach(btn=>btn.onclick=()=>{ ui.blockSel=shown[+btn.dataset.cand]; ui.sel=null; renderMap(); renderPane(); });
  pane.querySelectorAll('[data-saved]').forEach(btn=>btn.onclick=()=>{ ui.blockSel=S.blocks[+btn.dataset.saved]; ui.sel=null; renderMap(); renderPane(); });
  const sv=document.getElementById('save'); if(sv) sv.onclick=()=>{ commit(); S.blocks.push({...ui.blockSel}); changed(); toast('Block saved.'); };
  const us=document.getElementById('unsave'); if(us) us.onclick=()=>{ commit(); S.blocks=S.blocks.filter(b=>b.key!==ui.blockSel.key); changed(); };
}

/* ---------- export ---------- */
function exportObj(){
  const E = ends();
  return {
    area:'Burnaby Mountain', version:1, source:'Draft from GPX "'+DATA.meta.name+'"; elevations from the GPX, replace with LiDAR in the build step.',
    hubs: [...E.keys()].filter(n=>S.nodes[n]&&S.nodes[n].type).map(n=>({id:'J'+n, type:S.nodes[n].type, name:S.nodes[n].name||'', lat:N[n][0], lon:N[n][1], ele:N[n][2]})),
    segments: { type:'FeatureCollection', features: S.segs.map(s=>{ const st=segStats(s.path); return {
      type:'Feature', geometry:{type:'LineString', coordinates:s.path.map(n=>[N[n][1],N[n][0],N[n][2]])},
      properties:{id:s.id, name:s.name, kind:s.kind, grade:s.grade, gradeDown:s.gradeDown, oneway:s.oneway, notes:s.notes,
        from:'J'+s.path[0], to:'J'+s.path[s.path.length-1], length_m:Math.round(st.len), gain_fwd_m:Math.round(st.up), gain_rev_m:Math.round(st.dn)} }; }) },
    blocks: S.blocks.map((b,i)=>({id:'b'+(i+1), from:'J'+b.from, to:'J'+b.to, role:b.role, steps:b.steps, length_m:Math.round(b.len), gain_m:Math.round(b.up), loss_m:Math.round(b.dn)})),
    _editor: S
  };
}
function renderExport(){
  const txt = JSON.stringify(exportObj());
  pane.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:6px"><h3>Export data file</h3>
    <p class="small">Hubs, segments as GeoJSON, and saved blocks. This is the curated file the route generator will load. Save it as <code>data/burnaby-mountain/curated.json</code> and run <code>python3 scripts/build_router_data.py</code>.</p>
    <div class="row"><button id="download" class="primary">Download JSON</button><button id="copy">Copy JSON</button><span class="small muted">${(txt.length/1024).toFixed(0)} KB</span></div>
    <textarea id="export-text" readonly aria-label="Exported JSON">${esc(txt)}</textarea></div>
    <div style="display:flex;flex-direction:column;gap:6px"><h3>Load a saved file</h3>
    <textarea id="import-text" aria-label="Paste JSON to import" placeholder="Paste an exported file here"></textarea>
    <div class="row"><button id="import">Load</button></div></div>
    <div style="display:flex;flex-direction:column;gap:6px"><h3>Start over</h3>
    <p class="small muted">Your edits are saved in this browser only. Starting over restores the original GPX draft.</p>
    <div class="row">${ui.confirmReset?`<button id="reset-yes" class="danger">Yes, discard my edits</button><button id="reset-no">Keep editing</button>`:`<button id="reset">Start over from GPX</button>`}</div></div>`;
  document.getElementById('download').onclick=()=>{ const url=URL.createObjectURL(new Blob([document.getElementById('export-text').value],{type:'application/json'})); const l=document.createElement('a'); l.href=url; l.download='burnaby-mountain-curated.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000); };
  document.getElementById('copy').onclick=async()=>{ const ta=document.getElementById('export-text');
    try{ await navigator.clipboard.writeText(ta.value); toast('Copied.'); }catch(e){ ta.focus(); ta.select(); toast('Selected. Press Ctrl/Cmd+C to copy.'); } };
  document.getElementById('import').onclick=()=>{ try{ const o=JSON.parse(document.getElementById('import-text').value); const st=o._editor||o; if(!Array.isArray(st.segs)) throw 0; commit(); S=st; ui.sel=null; ui.blockSel=null; changed(); fit(); toast('Loaded.'); }catch(e){ toast('That isn’t an export from this editor. Paste the whole file.'); } };
  const r=document.getElementById('reset'); if(r) r.onclick=()=>{ ui.confirmReset=true; renderPane(); };
  const rn=document.getElementById('reset-no'); if(rn) rn.onclick=()=>{ ui.confirmReset=false; renderPane(); };
  const ry=document.getElementById('reset-yes'); if(ry) ry.onclick=()=>{ commit(); S=freshState(); restored=false; ui.confirmReset=false; ui.sel=null; ui.blockSel=null; changed(); fit(); toast('Back to the GPX draft. Undo is still available.'); };
}

function renderMeta(){
  const total = S.segs.reduce((a,s)=>a+segStats(s.path).len,0);
  document.getElementById('meta').textContent = `© OpenStreetMap contributors · ${S.segs.length} segments · ${ends().size} junctions · ${(total/1000).toFixed(1)} km unique trail · ${hubList().length} hubs · ${S.blocks.length} blocks`;
}

renderTabs(); renderMeta(); renderPane();
requestAnimationFrame(fit);
window.addEventListener('resize', ()=>{ if(view){ const r=svg.getBoundingClientRect(); const k=view.w/view.h, a=r.width/Math.max(1,r.height); if(Math.abs(k-a)>0.01) fit(); } });
</script>
</body>
</html>
