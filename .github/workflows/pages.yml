name: Deploy site to GitHub Pages
# Publishes site/ to the root of the gh-pages branch (Pages source: Deploy from a branch, gh-pages, / (root)).
# PR previews live under pr-preview/ on the same branch (preview.yml), so this deploy leaves that folder alone.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: site
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false
