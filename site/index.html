<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Burnaby Mountain Route Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&family=Overpass+Mono:wght@400;600&display=swap">
<style>
/* Layout: planner rail (targets, options, cue sheet) beside a trail map with an elevation strip; stacks on phones. */
:root{
  --bg:#edf0ea; --surface:#f8faf6; --ink:#1b2620; --muted:#5f6d64; --line:#cfd6cc; --faint:#dde3da;
  --accent:#e2560f; --accent-soft:#fbe3d4; --lap2:#1864ab; --lap3:#7b3fb4; --lap4:#2b8a3e;
  --net:#9aa79c; --ref:#c9d0c6; --ok:#2b8a3e; --warn:#c2410c;
  --font-ui:"Overpass",ui-sans-serif,system-ui,sans-serif;
  --font-num:"Overpass Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111713; --surface:#18201b; --ink:#e3e9e3; --muted:#93a198; --line:#2c3730; --faint:#212a24;
  --accent:#ff7a33; --accent-soft:#3a2418; --lap2:#4dabf7; --lap3:#b98cf0; --lap4:#51cf66;
  --net:#56635a; --ref:#2b352e; --ok:#51cf66; --warn:#ff8c42; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111713; --surface:#18201b; --ink:#e3e9e3; --muted:#93a198; --line:#2c3730; --faint:#212a24;
  --accent:#ff7a33; --accent-soft:#3a2418; --lap2:#4dabf7; --lap3:#b98cf0; --lap4:#51cf66;
  --net:#56635a; --ref:#2b352e; --ok:#51cf66; --warn:#ff8c42; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.45}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}
header{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
header h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em}
header h1 span{color:var(--accent)}
header p{margin:0;color:var(--muted);font-size:12px}
.main{display:grid;grid-template-columns:380px minmax(0,1fr);min-height:0}
aside{border-right:1px solid var(--line);background:var(--surface);overflow:auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:16px;min-width:0}
.mapcol{display:grid;grid-template-rows:minmax(0,1fr) auto;min-width:0;min-height:0}
.mapwrap{position:relative;overflow:hidden;min-height:0}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map.dragging{cursor:grabbing}
.maptools{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap}
.profile-wrap{border-top:1px solid var(--line);background:var(--surface);padding:8px 12px 6px;position:relative}
#profile{width:100%;height:120px;display:block;touch-action:none}
.tip{position:absolute;top:6px;right:12px;font-family:var(--font-num);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
h2{font-size:11px;margin:0;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
p{margin:0}
.small{font-size:12px}.muted{color:var(--muted)}
button{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 11px;cursor:pointer}
button:hover{background:var(--faint)}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{filter:brightness(1.05)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.form .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
input[type=number],input[type=text],select{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
input[type=number]{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.unit{position:relative}
.unit input{padding-right:38px}
.unit span{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:12px;pointer-events:none}
.ratio{font-family:var(--font-num);font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%;font-weight:400}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .letter{font-weight:800;font-size:16px;width:22px;color:var(--accent)}
.opt .nums{font-family:var(--font-num);font-variant-numeric:tabular-nums;font-size:14px}
.opt .sub{grid-column:2/4;font-size:12px;color:var(--muted)}
.opt .time{font-family:var(--font-num);font-size:12px;color:var(--muted);text-align:right}
.hit{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;white-space:nowrap}
.hit.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.hit.off{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.notice{border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:6px;padding:9px 11px;font-size:13px;background:var(--bg)}
.cues{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cue{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line);align-items:baseline}
.cue:last-child{border-bottom:0}
.cue .km{font-family:var(--font-num);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cue .nm{min-width:0;overflow-wrap:anywhere}
.cue .v{font-family:var(--font-num);font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.cue.lap{background:var(--faint);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.06em;grid-template-columns:1fr}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;background:var(--bg);padding:8px 10px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.code{font-family:var(--font-num);font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 9px;user-select:all}
.sym{display:inline-block;vertical-align:-1px;margin-right:4px}
textarea{width:100%;min-height:90px;font-family:var(--font-num);font-size:11px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px}
.toast{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 12px;border-radius:6px;font-size:13px}
.busy{position:absolute;right:12px;top:12px;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:6px;font-size:12px}
@media (max-width:820px){
  .app{height:auto}
  .main{grid-template-columns:1fr}
  aside{border-right:0;border-bottom:1px solid var(--line);overflow:visible;order:2}
  .mapcol{order:1;height:70vh}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Burnaby Mountain <span>Route Builder</span></h1>
    <p id="netmeta"></p>
  </header>
  <div class="main">
    <aside>
      <form id="form" class="form" novalidate>
        <div class="seg full" role="group" aria-label="What to build"><button type="button" id="m-target" aria-pressed="true">Hit a target</button><button type="button" id="m-long" aria-pressed="false">Longest loop</button></div>
        <label class="f full">Start<select id="start"></select></label>
        <p class="small muted full" id="longnote" hidden>Builds the longest loops from this start, from no repeated trail at all up to covering every trail with as few repeats as possible.</p>
        <label class="f tgt">Distance<div class="unit"><input type="number" id="dist" min="3" max="80" step="0.5" value="21"><span>km</span></div></label>
        <label class="f tgt">Climb<div class="unit"><input type="number" id="gain" min="0" max="5000" step="50" value="900"><span>m</span></div></label>
        <p class="ratio full tgt" id="ratio"></p>
        <label class="f">Hardest trails<select id="maxg">
          <option value="1">Green only</option><option value="2" selected>Up to blue</option><option value="3">Up to black</option><option value="4">Anything</option></select></label>
        <label class="f tgt">Last third<select id="late">
          <option value="0">Same as above</option><option value="2" selected>Blue or easier</option><option value="1">Green only</option></select></label>
        <label class="f tgt">Back at start every<select id="lap">
          <option value="0">Don't need to</option><option value="8">~8 km</option><option value="10">~10 km</option><option value="12">~12 km</option><option value="15">~15 km</option></select></label>
        <label class="f tgt">Paved sections<select id="paved">
          <option value="0">Don't mind</option><option value="1" selected>Avoid</option><option value="2">Avoid strongly</option></select></label>
        <div class="row full"><button type="submit" class="primary" id="go">Build routes</button><button type="button" id="shuffle" class="tgt">New variations</button></div>
      </form>
      <div id="results"></div>
      <div id="cuesheet"></div>
      <div id="share"></div>
    </aside>
    <div class="mapcol">
      <div class="mapwrap">
        <svg id="map" aria-label="Route map"></svg>
        <div class="maptools"><button id="fit">Fit route</button><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button></div>
        <div class="busy" id="busy" hidden>Building routes…</div>
        <div class="toast" id="toast" hidden></div>
      </div>
      <div class="profile-wrap"><svg id="profile" aria-label="Elevation profile"></svg><div class="tip" id="tip"></div></div>
    </div>
  </div>
</div>


<script src="js/router-core.js"></script>
<script type="module">
const DATA = await fetch('data/burnaby-mountain.json').then(r => r.json());
const NS='http://www.w3.org/2000/svg';
const N=DATA.nodes, R=6371000, lat0=N[0][0]*Math.PI/180;
const X=N.map(n=>n[1]*Math.PI/180*R*Math.cos(lat0)), Y=N.map(n=>-n[0]*Math.PI/180*R);
const d2=(a,b)=>Math.hypot(X[a]-X[b],Y[a]-Y[b]);
const GRADE_NAMES={1:'Green',2:'Blue',3:'Black',4:'Double black'};

/* ---------- graph (shared with the worker and tests, see js/router-core.js) ---------- */
const {edges, adj, inc, jnodes, J} = buildGraph(DATA);
const totalKm = edges.reduce((a,e)=>a+e.len,0)/1000;
document.getElementById('netmeta').textContent = `${edges.length} trail segments · ${totalKm.toFixed(1)} km of vetted trail · elevations approximate · map data © OpenStreetMap contributors`;

/* trailheads */
const cx=X.reduce((a,b)=>a+b,0)/X.length, cy=Y.reduce((a,b)=>a+b,0)/Y.length;
function compass(n){ const a=Math.atan2(-(Y[n]-cy), X[n]-cx)*180/Math.PI; const dirs=['East','North-east','North','North-west','West','South-west','South','South-east']; return dirs[Math.round(((a+360)%360)/45)%8]; }
const TH = DATA.th.map(t=>({node:t.node, j:J(t.node), name: t.name && t.name!=='GPX start' ? t.name : `${compass(t.node)} trailhead`, ele:N[t.node][2]}));
const startSel=document.getElementById('start');
TH.forEach((t,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=`${t.name} · ${Math.round(t.ele)} m`; startSel.appendChild(o); });

/* ---------- worker ---------- */
const worker = new Worker('js/router-worker.js');
worker.postMessage({graph:workerGraph({edges, adj, inc})});
let reqId=0, pending=null;
worker.onmessage = e => { if(e.data.id!==reqId) return; document.getElementById('busy').hidden=true; document.getElementById('go').disabled=false; showResults(e.data.res); };

/* ---------- state ---------- */
let params=null, routes=[], sel=0, seed=4821, mode='target';
function setMode(m){ mode=m; document.getElementById('m-target').setAttribute('aria-pressed',m==='target'); document.getElementById('m-long').setAttribute('aria-pressed',m==='longest');
  document.querySelectorAll('.tgt').forEach(x=>x.hidden = m==='longest'); document.getElementById('longnote').hidden = m!=='longest'; }
document.getElementById('m-target').onclick=()=>setMode('target');
document.getElementById('m-long').onclick=()=>setMode('longest');
function readForm(){
  return { th:+startSel.value, D:+document.getElementById('dist').value*1000, E:+document.getElementById('gain').value,
    maxg:+document.getElementById('maxg').value, late:+document.getElementById('late').value, lap:+document.getElementById('lap').value,
    paved:+document.getElementById('paved').value };
}
function writeForm(p){
  startSel.value=p.th; document.getElementById('dist').value=p.D/1000; document.getElementById('gain').value=p.E;
  document.getElementById('maxg').value=p.maxg; document.getElementById('late').value=p.late; document.getElementById('lap').value=p.lap; document.getElementById('paved').value=p.paved;
  updateRatio();
}
function updateRatio(){
  const D=+document.getElementById('dist').value, E=+document.getElementById('gain').value;
  document.getElementById('ratio').textContent = D>0 ? `${Math.round(E/D)} m of climb per km` : '';
}
['dist','gain'].forEach(id=>document.getElementById(id).addEventListener('input',updateRatio));
function build(){
  const f=readForm();
  if(mode==='longest'){
    params={...f, mode:'longest', seed}; reqId++;
    document.getElementById('busy').hidden=false; document.getElementById('go').disabled=true;
    worker.postMessage({id:reqId, params:{mode:'longest', start:TH[f.th].j, maxg:f.maxg}}); return;
  }
  if(!(f.D>=3000 && f.D<=80000)){ toast('Pick a distance between 3 and 80 km.'); return; }
  if(!(f.E>=0 && f.E<=5000)){ toast('Pick a climb between 0 and 5000 m.'); return; }
  params={...f, mode:'target', seed};
  reqId++;
  document.getElementById('busy').hidden=false; document.getElementById('go').disabled=true;
  worker.postMessage({id:reqId, params:{start:TH[f.th].j, D:f.D, E:f.E, maxg:f.maxg, late:f.late>=f.maxg?0:f.late, lap:f.lap, pavedW:[0,1.5,3.5][f.paved], seed}});
}
document.getElementById('form').addEventListener('submit', e=>{ e.preventDefault(); build(); });
document.getElementById('shuffle').onclick=()=>{ seed=Math.floor(Math.random()*90000)+10000; build(); };

/* ---------- route geometry ---------- */
function routeGeom(r){
  const pts=[]; const lapAt=new Set(r.bounds); const cuts=[]; let cum=0;
  r.steps.forEach(([e,dir],i)=>{
    if(lapAt.has(i)) cuts.push(cum);
    const p = dir>0 ? edges[e].p : edges[e].p.slice().reverse();
    p.forEach((n,k)=>{ if(pts.length && k===0) return; if(pts.length) cum+=d2(pts[pts.length-1].n,n); pts.push({n,cum,lap:cuts.length-1}); });
  });
  return {pts, cuts};
}
const fmtKm=m=>(m/1000).toFixed(m<10000?2:1)+' km';
function estTime(s){ const min = s.dist/1000*6.5 + s.gain*4/60; const h=Math.floor(min/60), m=Math.round(min%60); return h? `${h}h ${String(m).padStart(2,'0')}m` : `${m} min`; }

function hitChip(val, target, tol, unit){
  const off=val-target, ok=Math.abs(off)<=tol;
  return `<span class="hit ${ok?'ok':'off'}">${ok?'on target':(off>0?'+':'')+Math.round(off)+' '+unit}</span>`;
}

function showLongest(el){
  const tot=reachableKm(TH[params.th].j, params.maxg);
  el.innerHTML = `<h2 style="margin-bottom:8px">Longest loops</h2><div class="opts">${routes.map((r,i)=>`
    <button class="opt" data-i="${i}" aria-pressed="${i===sel}">
      <span class="letter">${'ABC'[i]}</span>
      <span class="nums">${esc(r.label)} · ${fmtKm(r.s.dist)}</span>
      <span class="time">~${estTime(r.s)}</span>
      <span class="sub">↑${Math.round(r.s.gain)} m · ${Math.round(r.s.rep/r.s.dist*100)}% repeated · ${Math.round(Math.min(100,(r.s.dist-r.s.rep)/1000/tot*100))}% of trails covered${r.s.paved>200?` · ${fmtKm(r.s.paved)} paved`:''}<br>${esc(r.desc)}</span>
    </button>`).join('')}</div>
    <p class="small muted" style="margin-top:6px">${tot.toFixed(1)} km of trail at this difficulty connects to this start. Time assumes 6:30/km plus 4 s per metre of climb.</p>`;
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ sel=+b.dataset.i; el.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed', +x.dataset.i===sel)); renderAll(); fitRoute(); });
  renderAll(); fitRoute();
}
function showResults(res){
  routes=res.map(r=>({...r, geom:null}));
  routes.forEach(r=>r.geom=routeGeom(r));
  sel=0;
  const el=document.getElementById('results');
  if(!routes.length){ el.innerHTML=`<div class="notice">No loop fits these settings from this start. Try a shorter distance or allow harder trails.</div>`; renderAll(); return; }
  if(params.mode==='longest') return showLongest(el);
  const best=routes[0].s; let note='';
  const rk=reachableKm(TH[params.th].j, params.maxg);
  if(rk < params.D/1000*0.6) note+=`<div class="notice">Only ${rk.toFixed(1)} km of trail at this difficulty connects to this start, so expect a lot of repeating. Allow harder trails or pick another start for more variety.</div>`;
  if(best.gain < params.E*0.85) note+=`<div class="notice">The closest is ${Math.round(best.gain)} m of climb. At ${params.D/1000} km the trails you allowed don't reach ${params.E} m without lots of repeats. Try a longer distance or allow harder trails.</div>`;
  else if(best.gain > params.E*1.2) note+=`<div class="notice">Hard to keep this flat: the closest is ${Math.round(best.gain)} m of climb.</div>`;
  el.innerHTML = `<h2 style="margin-bottom:8px">Options</h2>${note}<div class="opts">${routes.map((r,i)=>`
    <button class="opt" data-i="${i}" aria-pressed="${i===sel}">
      <span class="letter">${'ABC'[i]}</span>
      <span class="nums">${fmtKm(r.s.dist)} · ↑${Math.round(r.s.gain)} m</span>
      <span class="time">~${estTime(r.s)}</span>
      <span class="sub">${hitChip(r.s.dist/1000,params.D/1000,params.D/1000*0.05,'km')} ${hitChip(r.s.gain,params.E,Math.max(40,params.E*0.08),'m')} · ${Math.round(r.s.rep/r.s.dist*100)}% repeated${r.s.paved>200?` · ${fmtKm(r.s.paved)} paved`:''}${r.laps>1?` · ${r.laps} laps`:''}</span>
    </button>`).join('')}</div>
    <p class="small muted" style="margin-top:6px">Time assumes 6:30/km plus 4 s per metre of climb.</p>`;
  el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ sel=+b.dataset.i; el.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed', +x.dataset.i===sel)); renderAll(); fitRoute(); });
  renderAll(); fitRoute();
}

function reachableKm(start, maxg){
  const seen=new Set([start]), st=[start], es=new Set();
  while(st.length){ const u=st.pop(); for(const t of adj[u]){ const e=edges[t.e]; if((e.g||2)>maxg) continue; es.add(t.e); if(!seen.has(t.to)){ seen.add(t.to); st.push(t.to); } } }
  let L=0; for(const i of es) L+=edges[i].len; return L/1000;
}
/* ---------- cue sheet ---------- */
function stepLabel(ed){ return ed.n || (ed.k==='connector'?'Paved connector':'Unnamed trail'); }
function renderCues(){
  const box=document.getElementById('cuesheet'); const r=routes[sel];
  if(!r){ box.innerHTML=''; return; }
  const groups=[]; const lapAt=new Set(r.bounds); let cum=0;
  r.steps.forEach(([e,dir],i)=>{
    const ed=edges[e]; const lab=stepLabel(ed); const up=dir>0?ed.up:ed.dn, dn=dir>0?ed.dn:ed.up;
    const g=ed.g||null;
    if(lapAt.has(i) && r.laps>1) groups.push({lap:groups.filter(x=>x.lap).length+1});
    const last=groups[groups.length-1];
    if(last && !last.lap && last.lab===lab){ last.len+=ed.len; last.up+=up; last.dn+=dn; last.g=Math.max(last.g||0,g||0)||null; }
    else groups.push({lab, km:cum, len:ed.len, up, dn, g});
    cum+=ed.len;
  });
  const sym=g=> g===1?'<svg class="sym" width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4.5" fill="#2b8a3e"/></svg>':g===2?'<svg class="sym" width="10" height="10" viewBox="0 0 10 10"><rect x="1" y="1" width="8" height="8" fill="#1864ab"/></svg>':g>=3?'<svg class="sym" width="10" height="10" viewBox="0 0 10 10"><path d="M5 0 10 5 5 10 0 5z" fill="currentColor"/></svg>':'';
  box.innerHTML = `<h2 style="margin-bottom:8px">Route ${'ABC'[sel]} turn by turn</h2><div class="cues">
    <div class="cue"><span class="km">0.0</span><span class="nm"><b>Start</b> at ${esc(TH[params.th].name)}</span><span class="v"></span></div>
    ${groups.filter(g=>g.lap || g.len>=25).map(g=> g.lap ? `<div class="cue lap">Lap ${g.lap}${g.lap>1?' · back at start':''}</div>` :
      `<div class="cue"><span class="km">${(g.km/1000).toFixed(1)}</span><span class="nm">${sym(g.g)}${esc(g.lab)} <span class="muted small">${fmtKm(g.len)}</span></span><span class="v">${g.up>=15?'↑'+Math.round(g.up):''}${g.dn>=15?' ↓'+Math.round(g.dn):''}</span></div>`).join('')}
    <div class="cue"><span class="km">${(r.s.dist/1000).toFixed(1)}</span><span class="nm"><b>Finish</b> back at ${esc(TH[params.th].name)}</span><span class="v"></span></div>
  </div>`;
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- GPX + share ---------- */
function routeName(){ const r=routes[sel]; return params.mode==='longest' ? `Burnaby Mtn ${r.label} ${(r.s.dist/1000).toFixed(1)}k` : `Burnaby Mtn ${(r.s.dist/1000).toFixed(1)}k ${Math.round(r.s.gain)}m ${'ABC'[sel]}`; }
function gpx(){
  const r=routes[sel]; const nm=esc(routeName());
  const pts=r.geom.pts.map(p=>`<trkpt lat="${N[p.n][0]}" lon="${N[p.n][1]}"><ele>${N[p.n][2]}</ele></trkpt>`).join('\n');
  return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Burnaby Mountain Route Builder" xmlns="http://www.topografix.com/GPX/1/1">\n<metadata><name>${nm}</name></metadata>\n<trk><name>${nm}</name><type>running</type><trkseg>\n${pts}\n</trkseg></trk>\n</gpx>\n`;
}
function routeCode(){ const p=params; if(p.mode==='longest') return `L-${p.th}-${p.maxg}-${'abc'[sel]}`; return `${p.D/1000}-${p.E}-${p.th}-${p.maxg}${p.late}-${p.lap}-${p.paved}-${p.seed}-${'abc'[sel]}`; }
function parseCode(c){
  const l=c.trim().match(/^L-(\d+)-(\d)-([abc])$/i);
  if(l) return {longest:true, th:+l[1], maxg:+l[2], pick:'abc'.indexOf(l[3].toLowerCase())};
  const m=c.trim().match(/^(\d+(?:\.\d+)?)-(\d+)-(\d+)-(\d)(\d)-(\d+)-(\d)-(\d+)-([abc])$/i); if(!m) return null;
  return {D:+m[1]*1000,E:+m[2],th:+m[3],maxg:+m[4],late:+m[5],lap:+m[6],paved:+m[7],seed:+m[8],pick:'abc'.indexOf(m[9].toLowerCase())};
}
function saveFile(name, text, type){
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function renderShare(){
  const box=document.getElementById('share'); const r=routes[sel];
  if(!r){ box.innerHTML=''; return; }
  box.innerHTML = `<h2 style="margin-bottom:8px">Take it with you</h2>
    <div class="row"><button class="primary" id="dl">Download GPX</button><button id="copygpx">Copy GPX</button></div>
    <p class="small muted" style="margin-top:6px">Import the GPX into Strava, Garmin Connect or your watch app.</p>
    <textarea id="gpxtext" readonly hidden aria-label="GPX text"></textarea>
    <div style="display:flex;flex-direction:column;gap:6px;margin-top:14px"><h2>Route code</h2>
      <p class="small muted">Share this with your club. Anyone who enters it gets this exact route.</p>
      <div class="row"><span class="code" id="code">${routeCode()}</span><button id="copycode">Copy</button></div>
      <div class="row"><input type="text" id="loadcode" placeholder="Paste a route code" aria-label="Route code to load" style="flex:1;min-width:150px;font-family:var(--font-num);font-size:13px"><button id="load">Load</button></div>
    </div>`;
  document.getElementById('dl').onclick=()=>{ const name=routeName().replace(/[^\w .-]/g,''); saveFile(name+'.gpx', gpx(), 'application/gpx+xml'); };
  document.getElementById('copygpx').onclick=async()=>{
    const ta=document.getElementById('gpxtext'); ta.value=gpx();
    try{ await navigator.clipboard.writeText(ta.value); toast('GPX copied.'); }
    catch(e){ ta.hidden=false; ta.focus(); ta.select(); toast('Selected. Press Ctrl/Cmd+C to copy.'); }
  };
  document.getElementById('copycode').onclick=async()=>{ try{ await navigator.clipboard.writeText(routeCode()); toast('Code copied.'); }catch(e){ toast('Select the code and copy it.'); } };
  document.getElementById('load').onclick=()=>{
    const c=parseCode(document.getElementById('loadcode').value);
    if(!c || !TH[c.th]){ toast('That code doesn’t look right. It should look like 21-900-0-22-0-1-4821-a.'); return; }
    if(c.longest){ startSel.value=c.th; document.getElementById('maxg').value=c.maxg; setMode('longest'); }
    else { setMode('target'); writeForm(c); seed=c.seed; }
    pendingPick=c.pick; build();
  };
}
let pendingPick=null;
const _show=showResults;
showResults=function(res){ _show(res); if(pendingPick!=null && routes[pendingPick]){ sel=pendingPick; document.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed', +x.dataset.i===sel)); renderAll(); } pendingPick=null; };

/* ---------- map ---------- */
const svg=document.getElementById('map'); let view=null; let refG=null, netG=null;
function el(tag,attrs,parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
const pd=p=>'M'+p.map(n=>X[n].toFixed(1)+' '+Y[n].toFixed(1)).join('L');
function buildStatic(){
  const k=Math.PI/180*R*Math.cos(lat0), kk=Math.PI/180*R;
  refG=document.createElementNS(NS,'g');
  for(const w of DATA.ref) el('path',{d:'M'+w.c.map(c=>(c[0]*k).toFixed(1)+' '+(-c[1]*kk).toFixed(1)).join('L'),fill:'none',stroke:'var(--ref)','stroke-width':w.k==='trail'?1.3:1,'vector-effect':'non-scaling-stroke'},refG);
  netG=document.createElementNS(NS,'g');
  for(const e of edges) el('path',{d:pd(e.p),fill:'none',stroke:'var(--net)','stroke-width':1.8,'stroke-linecap':'round','stroke-linejoin':'round','vector-effect':'non-scaling-stroke'},netG);
}
const LAPC=['var(--accent)','var(--lap2)','var(--lap3)','var(--lap4)'];
function pxm(){ const r=svg.getBoundingClientRect(); return view.w/Math.max(1,r.width); }
function setView(v){ view=v; svg.setAttribute('viewBox',`${v.x} ${v.y} ${v.w} ${v.h}`); renderMap(); }
function fitBox(xs,ys){
  const r=svg.getBoundingClientRect(); let a=Math.min(...xs),b=Math.min(...ys),c=Math.max(...xs),d=Math.max(...ys);
  let w=(c-a)*1.15+80, h=(d-b)*1.15+80; const asp=r.width/Math.max(1,r.height);
  if(w/h<asp) w=h*asp; else h=w/asp; setView({x:(a+c)/2-w/2,y:(b+d)/2-h/2,w,h});
}
function fitRoute(){ const r=routes[sel]; if(!r){ fitBox(X,Y); return; } const ns=r.geom.pts.map(p=>p.n); fitBox(ns.map(n=>X[n]),ns.map(n=>Y[n])); }
let hoverPt=null;
function renderMap(){
  if(!view) return;
  if(!refG) buildStatic();
  svg.textContent=''; svg.appendChild(refG); svg.appendChild(netG);
  const px=pxm(); const r=routes[sel];
  for(const t of TH){ const s=6*px; el('rect',{x:X[t.node]-s,y:Y[t.node]-s,width:2*s,height:2*s,fill:'var(--surface)',stroke:'var(--ink)','stroke-width':1.5,'vector-effect':'non-scaling-stroke'},svg); }
  if(r){
    const pts=r.geom.pts;
    // casing + lap-coloured line
    let seg=[pts[0].n], lap=pts[0].lap;
    const flush=()=>{ if(seg.length>1){ el('path',{d:pd(seg),fill:'none',stroke:'var(--surface)','stroke-width':7,'stroke-linecap':'round','stroke-linejoin':'round','vector-effect':'non-scaling-stroke'},svg); el('path',{d:pd(seg),fill:'none',stroke:LAPC[Math.max(0,lap)%4],'stroke-width':4,'stroke-linecap':'round','stroke-linejoin':'round','stroke-opacity':.9,'vector-effect':'non-scaling-stroke'},svg);} };
    for(let i=1;i<pts.length;i++){ if(pts[i].lap!==lap){ seg.push(pts[i].n); flush(); seg=[pts[i].n]; lap=pts[i].lap; } else seg.push(pts[i].n); }
    flush();
    // direction arrows every ~600 m
    let nextAt=300;
    for(let i=1;i<pts.length;i++){
      if(pts[i].cum<nextAt) continue; nextAt+=600;
      const a=pts[i-1].n,b=pts[i].n; const ang=Math.atan2(Y[b]-Y[a],X[b]-X[a]); const s=6*px;
      const cxp=X[b], cyp=Y[b];
      const p1=[cxp+Math.cos(ang)*s, cyp+Math.sin(ang)*s], p2=[cxp+Math.cos(ang+2.5)*s, cyp+Math.sin(ang+2.5)*s], p3=[cxp+Math.cos(ang-2.5)*s, cyp+Math.sin(ang-2.5)*s];
      el('path',{d:`M${p1}L${p2}L${p3}Z`,fill:'var(--ink)',stroke:'var(--surface)','stroke-width':1,'vector-effect':'non-scaling-stroke'},svg);
    }
    const st=TH[params.th].node, s=8*px;
    el('rect',{x:X[st]-s,y:Y[st]-s,width:2*s,height:2*s,fill:'var(--ink)',stroke:'var(--surface)','stroke-width':2,'vector-effect':'non-scaling-stroke'},svg);
    const lab=el('text',{x:X[st]+12*px,y:Y[st]+4*px,'font-size':12*px,'font-weight':800,'font-family':'Overpass, sans-serif',fill:'var(--ink)',stroke:'var(--bg)','stroke-width':3,'paint-order':'stroke','vector-effect':'non-scaling-stroke'},svg); lab.textContent='Start / finish';
    if(hoverPt!=null){ const n=pts[hoverPt].n; el('circle',{cx:X[n],cy:Y[n],r:7*px,fill:'var(--accent)',stroke:'var(--surface)','stroke-width':2,'vector-effect':'non-scaling-stroke'},svg); }
  }
  // scale
  const sb=500, sx=view.x+view.w-24*px-sb, sy=view.y+view.h-20*px;
  el('line',{x1:sx,y1:sy,x2:sx+sb,y2:sy,stroke:'var(--ink)','stroke-width':2,'vector-effect':'non-scaling-stroke'},svg);
  const t=el('text',{x:sx+sb/2,y:sy-7*px,'text-anchor':'middle','font-size':11*px,'font-family':'Overpass Mono, monospace',fill:'var(--ink)'},svg); t.textContent='500 m';
}
function zoomAt(f,cxs,cys){ const r=svg.getBoundingClientRect(); const wx=view.x+(cxs-r.left)/r.width*view.w, wy=view.y+(cys-r.top)/r.height*view.h; setView({x:wx-(wx-view.x)*f,y:wy-(wy-view.y)*f,w:view.w*f,h:view.h*f}); }
let drag=null; const ptrs=new Map();
svg.addEventListener('pointerdown',e=>{ svg.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); drag=ptrs.size===1?{x:e.clientX,y:e.clientY,v:{...view}}:null; });
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)) return;
  if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; const d0=Math.hypot(a.x-b.x,a.y-b.y); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); const [c,d]=[...ptrs.values()]; const d1=Math.hypot(c.x-d.x,c.y-d.y); if(d0&&d1) zoomAt(d0/d1,(c.x+d.x)/2,(c.y+d.y)/2); return; }
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(drag){ svg.classList.add('dragging'); const k=pxm(); setView({...drag.v,x:drag.v.x-(e.clientX-drag.x)*k,y:drag.v.y-(e.clientY-drag.y)*k}); }
});
const endP=e=>{ ptrs.delete(e.pointerId); drag=null; svg.classList.remove('dragging'); };
svg.addEventListener('pointerup',endP); svg.addEventListener('pointercancel',endP);
svg.addEventListener('wheel',e=>{ e.preventDefault(); zoomAt(Math.exp(e.deltaY*0.0015),e.clientX,e.clientY); },{passive:false});
document.getElementById('fit').onclick=fitRoute;
document.getElementById('zin').onclick=()=>{ const r=svg.getBoundingClientRect(); zoomAt(0.7,r.left+r.width/2,r.top+r.height/2); };
document.getElementById('zout').onclick=()=>{ const r=svg.getBoundingClientRect(); zoomAt(1/0.7,r.left+r.width/2,r.top+r.height/2); };

/* ---------- profile ---------- */
const prof=document.getElementById('profile');
function renderProfile(){
  prof.textContent=''; const r=routes[sel]; const W=prof.getBoundingClientRect().width||600, H=120;
  prof.setAttribute('viewBox',`0 0 ${W} ${H}`);
  if(!r) return;
  const pts=r.geom.pts, total=pts[pts.length-1].cum; const es=pts.map(p=>N[p.n][2]);
  const lo=Math.min(...es), hi=Math.max(...es), pl=40, pr=8, pt=10, pb=20;
  const xs=d=>pl+d/total*(W-pl-pr), ys=e=>H-pb-(e-lo)/Math.max(1,hi-lo)*(H-pt-pb);
  for(const v of [lo,hi]){ el('line',{x1:pl,x2:W-pr,y1:ys(v),y2:ys(v),stroke:'var(--faint)'},prof); const t=el('text',{x:pl-6,y:ys(v)+4,'text-anchor':'end','font-size':10,'font-family':'Overpass Mono, monospace',fill:'var(--muted)'},prof); t.textContent=Math.round(v)+' m'; }
  const step=total>30000?10000:total>12000?5000:2000;
  for(let d=0; d<=total; d+=step){ const t=el('text',{x:xs(d),y:H-5,'text-anchor':d===0?'start':'middle','font-size':10,'font-family':'Overpass Mono, monospace',fill:'var(--muted)'},prof); t.textContent=(d/1000)+' km'; }
  const line=pts.map(p=>xs(p.cum).toFixed(1)+','+ys(N[p.n][2]).toFixed(1)).join(' ');
  el('polygon',{points:`${pl},${H-pb} ${line} ${W-pr},${H-pb}`,fill:'var(--accent-soft)'},prof);
  el('polyline',{points:line,fill:'none',stroke:'var(--accent)','stroke-width':1.8,'stroke-linejoin':'round'},prof);
  for(const c of r.geom.cuts.slice(1)) el('line',{x1:xs(c),x2:xs(c),y1:pt,y2:H-pb,stroke:'var(--ink)','stroke-dasharray':'3 3','stroke-width':1},prof);
  if(hoverPt!=null){ const p=pts[hoverPt]; el('line',{x1:xs(p.cum),x2:xs(p.cum),y1:pt,y2:H-pb,stroke:'var(--ink)','stroke-width':1},prof); el('circle',{cx:xs(p.cum),cy:ys(N[p.n][2]),r:3.5,fill:'var(--accent)'},prof); }
  prof._xs={pl,pr,W,total};
}
prof.addEventListener('pointermove',e=>{
  const r=routes[sel]; if(!r||!prof._xs) return; const b=prof.getBoundingClientRect(); const {pl,pr,W,total}=prof._xs;
  const d=Math.max(0,Math.min(total,((e.clientX-b.left)/b.width*W-pl)/(W-pl-pr)*total));
  const pts=r.geom.pts; let lo=0,hi=pts.length-1; while(hi-lo>1){ const m=(lo+hi)>>1; if(pts[m].cum<d) lo=m; else hi=m; }
  hoverPt=hi; document.getElementById('tip').textContent=`${(pts[hi].cum/1000).toFixed(2)} km · ${Math.round(N[pts[hi].n][2])} m`;
  renderMap(); renderProfile();
});
prof.addEventListener('pointerleave',()=>{ hoverPt=null; document.getElementById('tip').textContent=''; renderMap(); renderProfile(); });

let toastT; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2800); }
function renderAll(){ hoverPt=null; renderMap(); renderProfile(); renderCues(); renderShare(); }
window.addEventListener('resize',()=>{ if(view) fitRoute(); renderProfile(); });

updateRatio();
requestAnimationFrame(()=>{ fitBox(X,Y); build(); });
</script>
</body>
</html>
